name: Final V5 unified Overleaf build
on:
  push:
    branches: [final-v5-unified-integrated-2026-11-14, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile unified paper with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -xelatex -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Verify compiled manuscript
        run: |
          test -s main.pdf
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("main.tex").read_text()
          figure_2 = Path("figures/diagnostic_taxonomy_readable.tex").read_text()
          figure_3 = Path("figures/benchmark_capability_readable.tex").read_text()
          appendix_figure = Path("figures/curated_corpus_flow.tex").read_text()

          for index in range(1,14):
              assert rf"\label{{tab:v5_{index}}}" in root, index
          assert r"\label{fig:v5_1}" in root
          assert r"\label{fig:v5_3}" in figure_2
          assert r"\label{fig:v5_4}" in figure_3
          assert r"\label{fig:v5_corpus_flow}" in root
          assert r"\resizebox{\linewidth}{!}" in figure_2 and r"\begin{landscape}" not in figure_2
          assert r"\resizebox{\linewidth}{!}" in figure_3 and r"\begin{landscape}" not in figure_3
          assert root.count(r"\bibitem{v5ref") == 52
          assert root.count(r"\bibitem{v5supp") == 14
          assert r"\input{literature_coverage_2026.tex}" not in root

          supplemental=Path("bibliography_restored_2026.tex").read_text()
          keys=re.findall(r"\\bibitem\{([^}]+)\}", supplemental)
          assert len(keys)==139 and len(set(keys))==139
          files=[
            Path("related_literature") / (p + ".tex") for p in (
            "agent_foundations","collaboration","runtime_ops","failure_attribution",
            "observability","benchmark_context","safety_context","serving_context")
          ]
          content = root + "\n" + "\n".join(p.read_text() for p in files)
          cite_groups=re.findall(r"\\cite\{([^}]+)\}", content)
          cited={x.strip() for c in cite_groups for x in c.split(",")}
          all_keys=set(re.findall(r"\\bibitem\{([^}]+)\}", root)+keys)
          assert len(all_keys)==205 and all_keys==cited, (len(all_keys),len(cited),sorted(all_keys-cited),sorted(cited-all_keys))
          assert all(rf"\input{{related_literature/{p.stem}.tex}}" in root for p in files)
          assert r"\input{bibliography_restored_2026.tex}" in root
          print("PASS: 13 tables, 4 figures, 205 referenced bibliography records in body; Appendix D list removed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-v5-unified-pdf
          path: main.pdf
