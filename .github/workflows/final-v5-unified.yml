name: Final V5 unified Overleaf build
on:
  push:
    branches: [final-v5-unified-integrated-2026-11-14, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile unified paper with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -xelatex -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Verify compiled manuscript
        run: |
          test -s main.pdf
          python3 - <<'PY'
          from pathlib import Path
          t=Path("main.tex").read_text()
          for k in range(1,14):
              assert f"\\label{{tab:v5_{k}}}" in t
          assert all(f"\\label{{fig:v5_{k}}}" in t for k in [1,3,4])
          assert "\\label{fig:v5_corpus_flow}" in t
          assert t.count("\\bibitem{v5ref")==52
          assert t.count("\\bibitem{v5supp")==14
          extra=Path("bibliography_restored_2026.tex").read_text()
          atlas=Path("literature_coverage_2026.tex").read_text()
          import re
          keys=re.findall(r'\\\\bibitem\{([^}]+)\}', extra)
          cites=re.findall(r'\\\\cite\{(ext[0-9]+)\}', atlas)
          assert len(keys)==148 and len(set(keys))==148, len(keys)
          assert len(set(cites))==148, len(set(cites))
          assert set(keys)==set(cites)
          assert "\\input{bibliography_restored_2026.tex}" in t
          assert "\\input{literature_coverage_2026.tex}" in t
          assert 52 + 14 + len(keys) >= 201
          print("PASS: 13 tables, 4 figures, 214 distinct cited bibliography keys (60 core entries remain separate)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-v5-unified-pdf
          path: main.pdf
