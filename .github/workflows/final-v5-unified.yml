name: Final V5 unified Overleaf build
on:
  push:
    branches: [final-v5-unified-integrated-2026-11-14, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile unified paper with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -xelatex -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Verify compiled manuscript
        run: |
          test -s main.pdf
          python3 - <<'PY'
          from pathlib import Path
          t=Path("main.tex").read_text()
          for k in range(1,14):
              assert f"\\label{{tab:v5_{k}}}" in t
          for k in range(1,5):
              assert f"\\label{{fig:v5_{k}}}" in t
          assert t.count("\\bibitem{v5ref")==52
          assert t.count("\\bibitem{v5supp")==14
          print("PASS: 13 tables, 4 figures, 52 original refs and 14 supplemental primary sources")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-v5-unified-pdf
          path: main.pdf
